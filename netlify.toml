# Netlify configuration for niblgo.com
#
# The site is plain static HTML generated by `npm run build:site`, so there is
# nothing to compile at deploy time — Netlify just publishes the folder.

[build]
  publish = "website"
  command = "node scripts/build-site.js"

# --- Apple universal links -------------------------------------------------
#
# When you set up universal links, Apple fetches
# https://niblgo.com/.well-known/apple-app-site-association and REQUIRES it to
# be served as application/json. Netlify infers the type from the extension,
# and this file deliberately has none, so it goes out as text/plain and Apple
# silently ignores it — no error, links just open Safari instead of the app.
# This header is the fix. It is harmless until the file exists.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

# Android's equivalent. Netlify already serves .json correctly; this is here so
# both live in one place when you add them.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

# --- Baseline security headers ---------------------------------------------
#
# Nothing on this site takes input or runs script, so these cost nothing and
# close off the obvious embedding and sniffing tricks.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# --- Tidy URLs -------------------------------------------------------------
#
# So /privacy works as well as /privacy.html. App Store Connect and Play
# Console both store whatever URL you paste; short ones age better.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200
